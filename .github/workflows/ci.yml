# Continuous integration (D-01, D-10, D-11). Every lane runs the same
# `cmake --workflow --preset <lane>` command as a local build; the workflow
# adds only routing. The ruleset requires one check, `CI required`.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# No trigger-level path filter: a workflow skipped by paths leaves the required
# check Pending. The `changes` job decides what runs instead, and a job skipped
# by `if:` reports Success, which `CI required` then judges.
#
# `edited` re-runs EVERY lane on purpose: skipping the heavy lanes on a title
# edit would let a green edit run mask a failed run for the same head SHA.

permissions:
  contents: read

# Only a pull request's runs supersede each other; every push to main keeps a
# result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # heavy=false only for a pull request whose every changed path, old and new
  # name, is under .planning/; then the heavy jobs are skipped. The listing is
  # one `F <path>` line per changed file plus `R <old path>` for a rename, so the
  # classifier can count files rather than names.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 3  # 2 x slowest of runs 42737527955#1,42737527955#2 (5s)
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A failed listing adds a line outside .planning/, so it counts as heavy;
      # CHANGED_FILES catches a listing cut short by pagination.
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "heavy=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          { gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | "F " + .filename, (if .previous_filename then "R " + .previous_filename else empty end)' || echo '(listing failed)'; } |
            sh scripts/classify-changes.sh "$CHANGED_FILES" | tee -a "$GITHUB_OUTPUT"

  # Always runs: .planning/ is public prose where a home path can leak.
  hygiene:
    runs-on: ubuntu-26.04
    timeout-minutes: 3  # 2 x slowest of runs 42737527955#1,42737527955#2 (8s)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --workflow --preset hygiene

  # Conventional Commits title (D-14). The title is read live: a rerun reuses
  # the original event payload, so the payload's title can be stale.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 3  # 2 x slowest of runs 42737527955#1,42737527955#2 (6s)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TITLE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          sh scripts/check-title.sh "$TITLE"

  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            cc: gcc
            id: GNU
          - runner: macos-26
            cc: cc
            id: AppleClang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3  # 2 x slowest of runs 42737527955#1,42737527955#2 (36s)
    env:
      CC: ${{ matrix.cc }}
      GBL_EXPECT_C_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --workflow --preset ci
      # Diagnostic only: the verdict is the workflow's exit status.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.runner }}
          path: build/ci/junit.xml

  asan:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 3  # 2 x slowest of runs 42737527955#1,42737527955#2 (10s)
    env:
      GBL_EXPECT_C_ID: Clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Package names proven in an ubuntu:26.04 container (plan 01-05).
      - run: dpkg -s clang-21 libclang-rt-21-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y clang-21 libclang-rt-21-dev; }
      - run: cmake --workflow --preset asan

  # Complete pre-admission smoke/ARM/Thumb proof uses full Git history for
  # source-input identity. Its output hashes are log witnesses; ROMs stay local.
  # Other lanes stay shallow and metadata-only configuration does not require it.
  diagnostics:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            host: linux-x64
            cc: gcc
            id: GNU
          - runner: macos-26
            host: darwin-arm64
            cc: cc
            id: AppleClang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    env:
      CC: ${{ matrix.cc }}
      GBL_EXPECT_C_ID: ${{ matrix.id }}
      GBL_TOOLCHAIN_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull-request workflows otherwise check out the synthetic merge commit,
          # while the diagnostic receipt identifies the source branch head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: sh scripts/fetch-toolchain.sh --host "$GBL_TOOLCHAIN_HOST" --root build/toolchains
      - run: cmake --workflow --preset diagnostics

  # The single required check. `if: always()` makes it run (and fail) even
  # when a needed job failed or was skipped; CiRequired.cmake judges each
  # result. Every other job is listed in `needs`.
  ci-required:
    name: CI required
    if: always()
    needs: [changes, hygiene, title, build, asan, diagnostics]
    runs-on: ubuntu-26.04
    timeout-minutes: 3  # 2 x slowest of runs 42737527955#1,42737527955#2 (6s)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          EVENT: ${{ github.event_name }}
        run: cmake -P cmake/CiRequired.cmake
